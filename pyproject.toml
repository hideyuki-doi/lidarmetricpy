[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pcmetrics"
version = "0.2.0"
description = "Forest structure metrics from airborne lidar, identical to lidR/lidRmetrics, on GPU (CUDA, Apple MPS) or CPU"
authors = [{ name = "Hideyuki Doi" }]
keywords = ["lidar", "forest", "point cloud", "lidR", "GPU"]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "laspy[lazrs]>=2.5", "numba>=0.58", "shapely>=2.0", "rasterio>=1.3"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13"]
torch = ["torch>=2.2"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/hideyuki-doi/pcmetrics"

[tool.setuptools]
packages = ["pcmetrics"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:numba.*"]
